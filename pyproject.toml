[project]
name = "quickfilehost"
version = "0.1.0"
description = "Quickly spin up a server to serve one file"
readme = "README.md"
authors = [
    { name = "math0171512", email = "arch1507.hk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "flask",
]

[project.scripts]
quickfilehost = "quickfilehost:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
